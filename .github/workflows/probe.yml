name: Probe price feeds
on:
  push:
    branches: [main]
    paths: ["probe/run.txt"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY' > probe/out.txt 2>&1
          import json, urllib.request, gzip
          items = [l.strip() for l in open('items.txt', encoding='utf-8') if l.strip()]
          prev = json.load(open('incoming/prices.json', encoding='utf-8'))
          r = urllib.request.urlopen(urllib.request.Request('https://prices.csgotrader.app/latest/steam.json', headers={'User-Agent': 'Mozilla/5.0', 'Accept-Encoding': 'gzip'}), timeout=90)
          print('Last-Modified', r.headers.get('Last-Modified'), 'Date', r.headers.get('Date'))
          b = r.read(); b = gzip.decompress(b) if r.headers.get('Content-Encoding') == 'gzip' else b
          d = json.loads(b)
          print('prev fetched', prev.get('_fetched_at'))
          for n in items[:40]:
              print(n, '| ours', (prev.get(n) or {}).get('price'), '| feed', d.get(n))
          for f in ['skinport.json', 'buff163.json', 'csfloat.json']:
              try:
                  r = urllib.request.urlopen(urllib.request.Request('https://prices.csgotrader.app/latest/' + f, headers={'User-Agent': 'Mozilla/5.0'}), timeout=60)
                  print(f, r.status, r.headers.get('Last-Modified'))
              except Exception as e:
                  print(f, 'ERROR', e)
          PY
          git config user.name probe-bot; git config user.email probe-bot@users.noreply.github.com
          git add probe/out.txt && git commit -m "probe result" && git pull --rebase && git push
