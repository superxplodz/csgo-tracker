name: Apply prices

# Daily price update: pulls Steam prices from the CSGO Trader feed, Skinport prices and the
# USD->IDR rate, and merges them into the encrypted data.enc with the SITE_PASSWORD secret.
on:
  schedule:
    - cron: "47 23 * * *"   # 06:47 WIB (the feed refreshes around 05:30 WIB)
    - cron: "17 5 * * *"    # 12:17 WIB retry, in case the morning run failed
  push:
    branches: [main]
    paths: ["incoming/prices.json", "scripts/apply_prices.py"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apply-prices

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography==44.0.0 brotli==1.1.0
      - run: python scripts/apply_prices.py
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data.enc items.txt
          git diff --cached --quiet || git commit -m "Apply prices $(TZ=Asia/Jakarta date +%F)"
          git pull --rebase && git push
