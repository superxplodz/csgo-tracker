name: Apply prices

# The daily Claude task pushes plain Steam prices to incoming/prices.json.
# This job merges them into the encrypted data.enc with the SITE_PASSWORD secret.
on:
  push:
    branches: [main]
    paths: ["incoming/prices.json"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apply-prices

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography==44.0.0
      - run: python scripts/apply_prices.py
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data.enc items.txt
          git diff --cached --quiet || git commit -m "Apply prices $(TZ=Asia/Jakarta date +%F)"
          git pull --rebase && git push
