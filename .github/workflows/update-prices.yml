name: Update Steam prices

on:
  # No schedule: Steam rate-limits GitHub's servers. Daily prices come from the
  # home-PC task (scripts/run_update.ps1, set up with scripts/install_task.ps1).
  # This stays available as a manual backup from the Actions tab.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography==44.0.0
      - name: Fetch prices
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python scripts/update_prices.py
      - name: Commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data.enc
          git diff --cached --quiet || git commit -m "Daily Steam prices $(TZ=Asia/Jakarta date +%F)"
          git push
