name: Update Steam prices

on:
  schedule:
    - cron: "47 23 * * *"   # 06:47 WIB every day
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography==44.0.0
      - name: Fetch prices
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python scripts/update_prices.py
      - name: Commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data.enc
          git diff --cached --quiet || git commit -m "Daily Steam prices $(TZ=Asia/Jakarta date +%F)"
          git push
